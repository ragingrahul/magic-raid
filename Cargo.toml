[workspace]
members = [
    "programs/*"
]
resolver = "2"

[patch.crates-io]
ephemeral-rollups-sdk = { path = "vendor/ephemeral-rollups-sdk" }
magicblock-delegation-program-api = { path = "vendor/magicblock-delegation-program-api" }
magicblock-magic-program-api = { path = "vendor/magicblock-magic-program-api" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
